<!-- ================= POPUP STEP 1 ================= -->

<div id="pay-modal">
  <div id="pay-content">

    <div class="pay-header">
      🧾 XÁC NHẬN ĐƠN HÀNG
      <div class="pay-order-id" id="order-id"></div>
    </div>

    <div class="pay-guide" id="pay-text"></div>

    <div class="pay-body">

      <div class="pay-left">
        <h4>📦 Sản phẩm</h4>
        <ul id="pay-items"></ul>

        <div class="pay-total">
          Tổng tiền: <span id="pay-amount"></span>
        </div>

        <input id="customer-email"
               placeholder="Nhập email nhận file"
               style="width:100%;padding:8px;margin:8px 0">

        <div class="pay-actions">
          <button id="copy-order-btn">
            ✅ Xác nhận Email & Copy nội dung đơn
          </button>
        </div>
      </div>

    </div>

    <button class="pay-close" onclick="closePay()">Đóng</button>

  </div>
</div>



<!-- ================= POPUP STEP 2 ================= -->

<div id="pay-step2-modal"
     style="display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.4);
            backdrop-filter:blur(6px);
            justify-content:center;
            align-items:center;
            z-index:999;">

  <div style="background:white;
              width:95%;
              max-width:480px;
              border-radius:18px;
              padding:20px;
              box-shadow:0 12px 30px rgba(0,0,0,.3);">

    <div class="pay-header">
      💳 THANH TOÁN
      <div id="order-id-step2"></div>
    </div>

    <div class="pay-guide">
      <b>Hướng dẫn thanh toán:</b><br>
      <b>Bước 2:</b> Chuyển khoản thanh toán tương ứng, sau đó bấm nút "Xác nhận đã thanh toán"<br>
      <i>(Tài liệu sẽ được gửi tự động qua email trong thời gian 1 - 3 phút)</i>
    </div>

    <div style="text-align:center;margin-top:12px">
      <div style="font-size:20px;font-weight:bold;margin-bottom:10px;color:#e60000">
        Tổng tiền: <span id="pay-amount-step2"></span>
      </div>

      <img id="qr-img-step2"
           loading="lazy"
           style="max-width:280px;width:100%;margin-bottom:8px">

      <br>

      <a id="qr-link-step2"
         target="_blank"
         class="download-qr">
         📥 Mở ảnh QR
      </a>
    </div>

    <div style="margin-top:15px;text-align:center">
      <button onclick="confirmPaid()"
              style="background:#ff3b3b;
                     color:white;
                     border:none;
                     padding:10px 20px;
                     border-radius:8px;
                     font-size:15px;
                     cursor:pointer">
        ✅ Xác nhận đã thanh toán
      </button>
    </div>

    <div style="text-align:center;margin-top:10px">
      <button onclick="document.getElementById('pay-step2-modal').style.display='none'"
              style="background:#ccc;
                     border:none;
                     padding:6px 16px;
                     border-radius:6px;
                     cursor:pointer">
        Đóng
      </button>
    </div>

  </div>
</div>
