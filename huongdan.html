<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Hướng dẫn mua file luyện chữ đẹp | BaolongEdu</title>
<link rel="icon" href="favicon.png" type="image/png">

<meta name="description" content="Hướng dẫn chi tiết từng bước cách chọn sản phẩm, thêm vào giỏ hàng và thanh toán để nhận file luyện chữ đẹp nhanh chóng.">

<!-- OPEN GRAPH -->
<meta property="og:title" content="Hướng dẫn mua file luyện chữ đẹp">
<meta property="og:description" content="Xem video hướng dẫn chi tiết cách mua file luyện chữ đẹp và thanh toán để nhận file nhanh chóng.">
<meta property="og:image" content="https://fileluyenchudep.site/thumb-huongdan.jpg">
<meta property="og:url" content="https://fileluyenchudep.site/huongdan.html">
<meta property="og:type" content="website">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>


<div id="header"></div>

<section class="hero">
  <h2>Hướng dẫn mua tài liệu</h2>
  <p>Xem video hướng dẫn chi tiết cách mua và nhận tài liệu nhanh chóng</p>
</section>

<section class="section">

  <div class="block-title">
    <h2>Video hướng dẫn mua tài liệu</h2>
    <p>Thực hiện theo các bước trong video để hoàn tất đơn hàng chỉ trong vài phút</p>
  </div>

  <div style="max-width:900px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);">
    <div style="position:relative;padding-bottom:56.25%;height:0;">
      <iframe
        src="https://www.youtube.com/embed/H44bIZdtKzM"
        title="Video hướng dẫn mua tài liệu"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        style="position:absolute;top:0;left:0;width:100%;height:100%;">
      </iframe>
    </div>
  </div>

</section>

<div id="cart-box" onclick="openCart()">
  <span class="cart-icon">🛒</span>
  <span id="cart-total-mini">0đ</span>
  <span id="cart-count">0</span>
</div>

<div id="cart-box-full" style="display:none">
  <div id="cart-box-full-inner">
    <div id="cart-header">
      <b>🛒 Giỏ hàng</b>
      <button onclick="toggleCart()">➖</button>
    </div>
    <ul id="cart-items"></ul>
    <p class="cart-sum">Tổng cộng: <span id="cart-total">0</span> đ</p>
    <button class="pay-btn" onclick="openPay()">Thanh toán ngay</button>
  </div>
</div>

<div id="toast"></div>

<div id="footer"></div>

<div id="payment-container"></div>
<script src="load-payment.js"></script>
<script src="cart.js" defer></script>
<script src="load-components.js"></script>

</body>
</html>
